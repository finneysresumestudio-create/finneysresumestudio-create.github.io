<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    font-family:"Inter",system-ui,sans-serif;
    background:
      radial-gradient(70% 90% at 88% 6%, #eaf4fb 0%, rgba(234,244,251,0) 60%),
      radial-gradient(60% 80% at 2% 100%, #eef4fb 0%, rgba(238,244,251,0) 55%),
      #ffffff;
    display:flex; align-items:center; gap:40px;
    padding:0 60px; position:relative;
  }
  /* navy accent bar */
  body::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;
    background:linear-gradient(180deg,#84c5e6,#1e5aa8 45%,#0f3460);}

  .left{width:600px;flex:none;}
  .logo{height:150px;width:auto;margin-bottom:26px;}
  h1{
    font-family:"Fraunces",Georgia,serif;font-weight:600;color:#0f3460;
    font-size:52px;line-height:1.06;letter-spacing:-0.015em;margin-bottom:18px;
  }
  h1 em{font-style:italic;color:#1e5aa8;}
  .sub{font-size:22px;color:#3c4a5e;line-height:1.45;font-weight:400;}
  .rule{width:88px;height:4px;background:#84c5e6;border-radius:3px;margin:24px 0 22px;}
  .url{
    margin-top:30px;font-size:18px;font-weight:600;color:#0f3460;
    display:inline-flex;align-items:center;gap:10px;
    background:#eaf4fb;padding:11px 20px;border-radius:100px;
  }

  /* right: before -> after */
  .right{position:relative;flex:1;height:520px;}
  .shot{position:absolute;border-radius:10px;overflow:hidden;background:#fff;
    border:1px solid #e3e8ef;box-shadow:0 30px 70px -22px rgba(10,35,66,.45);}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
  .before{width:250px;height:325px;left:0;top:74px;filter:grayscale(.35);opacity:.85;}
  .after {width:300px;height:390px;right:6px;top:44px;box-shadow:0 40px 90px -26px rgba(10,35,66,.55);}
  .tag{
    position:absolute;font-size:12px;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;padding:6px 13px;border-radius:100px;
  }
  .tag-b{left:34px;top:34px;background:#eef1f6;color:#67748a;}
  .tag-a{right:96px;top:0px;background:#0f3460;color:#fff;}
  .arrow{
    position:absolute;left:218px;top:204px;width:56px;height:56px;border-radius:50%;
    background:#84c5e6;color:#0a2342;display:grid;place-items:center;z-index:5;
    border:4px solid #fff;box-shadow:0 12px 28px -8px rgba(10,35,66,.5);
  }
</style>
</head>
<body>
  <div class="left">
    <img class="logo" src="assets/img/logo.png" alt="" />
    <h1>Resume &amp; LinkedIn<br/><em>transformations</em></h1>
    <div class="rule"></div>
    <p class="sub">Strategic resume writing that turns your experience into a career story that opens doors.</p>
    <div class="url">finneysresumestudio-create.github.io</div>
  </div>

  <div class="right">
    <span class="tag tag-b">Before</span>
    <div class="shot before"><img src="assets/img/transformations/emily-carter-before.jpg" alt="" /></div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </div>
    <span class="tag tag-a">After</span>
    <div class="shot after"><img src="assets/img/transformations/emily-carter-after.jpg" alt="" /></div>
  </div>
</body>
</html>
